<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Precision Workbench — report prototype</title>
<style>
  :root {
    --canvas: oklch(96% 0.004 260); --surface: oklch(100% 0 0);
    --sidebar: oklch(18% 0.02 260); --sidebar-text: oklch(85% 0.01 260);
    --text: oklch(18% 0.01 260); --muted: oklch(50% 0.01 260); --border: oklch(90% 0.005 260);
    --accent: oklch(56% 0.16 260); --danger: oklch(58% 0.18 25);
    --shadow: 0 1px 2px oklch(0% 0 0 / 0.04), 0 4px 12px oklch(0% 0 0 / 0.06);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--text); }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: var(--sidebar); color: var(--sidebar-text); padding: 1.5rem 1.25rem; }
  .sidebar .brand { font-weight: 700; font-size: 1.05rem; color: white; margin-bottom: 2rem; }
  .sidebar nav a { display: block; padding: 0.55rem 0.75rem; border-radius: 8px; color: var(--sidebar-text); text-decoration: none; font-size: 0.875rem; margin-bottom: 0.15rem; }
  .sidebar nav a.active { background: oklch(28% 0.03 260); color: white; font-weight: 600; }
  .main { padding: 1.75rem 2rem 3rem; }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.5rem; }
  .topbar h1 { font-size: 1.25rem; margin: 0; }
  .topbar .meta { color: var(--muted); font-size: 0.875rem; }
  .pill { padding: 0.25em 0.75em; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: color-mix(in oklch, var(--danger) 16%, white); color: oklch(45% 0.16 25); }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
  .kpi-card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 1.1rem 1.25rem; }
  .kpi-card .label { font-size: 0.8125rem; color: var(--muted); margin-bottom: 0.4rem; }
  .kpi-card .value { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }

  .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 1.25rem 1.5rem; }
  .card h3 { margin: 0 0 1rem; font-size: 0.95rem; }
  .timeline { font-size: 0.8125rem; }
  .timeline div { display: flex; gap: 0.75rem; padding-block: 0.4rem; border-bottom: 1px solid var(--border); }
  .timeline div:last-child { border-bottom: none; }
  .timeline b { font-family: ui-monospace, monospace; color: var(--muted); flex: 0 0 3.5rem; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Forma Workbench</div>
    <nav>
      <a href="#">리뷰</a>
      <a href="#">테스트</a>
      <a href="#" class="active">보고서 대시보드</a>
      <a href="#">설정</a>
    </nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>7월 21일 알림 발송 지연 장애</h1>
        <div class="meta">원인 분석과 개선 제안</div>
      </div>
      <span class="pill">SEV-2</span>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card"><div class="label">영향 시간</div><div class="value">약 55분</div></div>
      <div class="kpi-card"><div class="label">영향 사용자</div><div class="value">약 3.2만 명</div></div>
      <div class="kpi-card"><div class="label">근본 원인</div><div class="value" style="font-size:1.05rem">DB 커넥션 풀 고갈</div></div>
    </div>

    <div class="content-grid">
      <div class="card">
        <h3>타임라인</h3>
        <div class="timeline">
          <div><b>14:12</b>지연 첫 감지</div>
          <div><b>14:31</b>커넥션 풀 고갈 확인</div>
          <div><b>14:45</b>자동 확장 완료(지연)</div>
          <div><b>15:07</b>정상 복구</div>
        </div>
      </div>
      <div class="card">
        <h3>추천</h3>
        <p style="font-size:0.9375rem;">옵션 B: 커넥션 풀 상향 + 조기 경보 + 자동 확장 트리거를 큐 지연 기준으로 변경. 이번 주 내 적용.</p>
      </div>
    </div>
  </main>
</div>
</body>
</html>
